name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'packages/shared/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-marketing.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Build marketing (static export)
        env:
          EXPORT_STATIC: 'true'
          NEXT_PUBLIC_MARKETING_DOMAIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          NEXT_PUBLIC_ADMIN_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/coming-soon
        run: pnpm --filter @bm/marketing build

      - name: Add .nojekyll
        run: touch apps/marketing/out/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/marketing/out
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: |
            Deploy marketing site

            ${{ github.event.head_commit.message }}
