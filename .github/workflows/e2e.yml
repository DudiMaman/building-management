name: E2E (marketing)

on:
  pull_request:
    paths:
      - 'apps/marketing/**'
      - 'apps/e2e/**'
      - 'packages/shared/**'
      - 'packages/config/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'apps/marketing/**'
      - 'apps/e2e/**'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Run against this URL (default: local dev server)'
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @bm/e2e install:browsers

      - name: Run e2e tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.base_url }}
          CI: 'true'
        run: pnpm --filter @bm/e2e e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14
